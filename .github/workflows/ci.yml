name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required by Datadog WIF to exchange the OIDC token
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Get Datadog credentials
      id: datadog-wif
      uses: DataDog/datadog-workload-identity-federation-github-action/intake@c9456387851248e0a5452f99085b16ad14fc3acb # v1.0.0
      with:
        org_uuid: 8dee7c38-00cb-11ea-a77b-8b5a08d3b091 # Datadog HQ (org 2)
        site: datadoghq.com

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      env:
        NODE_OPTIONS: -r dd-trace/ci/init
        DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
        DD_API_KEY: ${{ steps.datadog-wif.outputs.api_key }}
        DD_SERVICE: code-review-action
        DD_ENV: ci
      run: npm test

  actionlint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install actionlint
      run: |
        VERSION=1.7.12
        curl -sL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
          | tar xz -C /usr/local/bin actionlint
    - name: Run actionlint
      # -ignore: actionlint doesn't yet know about the job.workflow_repository/
      # job.workflow_sha context properties (shipped in actions/runner
      # v2.334.0, still undocumented when rhysd/actionlint#647 was filed).
      # Remove this once https://github.com/rhysd/actionlint/pull/696 ships.
      run: |
        actionlint \
          -ignore 'property "workflow_(repository|sha)" is not defined' \
          .github/workflows/code-review.yml .github/workflows/ci.yml .github/workflows/ai-review.yml
