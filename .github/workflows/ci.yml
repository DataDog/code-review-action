name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required by dd-sts-action to exchange OIDC token
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Get Datadog credentials
      id: dd-sts
      uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2 # v1.0.5
      with:
        policy: code-review-action-ci

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      env:
        NODE_OPTIONS: -r dd-trace/ci/init
        DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
        DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
        DD_SERVICE: code-review-action
        DD_ENV: ci
      run: npm test

  actionlint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install actionlint
      run: |
        VERSION=1.7.12
        curl -sL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
          | tar xz -C /usr/local/bin actionlint
    - name: Run actionlint
      # -ignore: actionlint doesn't yet know about the job.workflow_repository/
      # job.workflow_sha context properties (shipped in actions/runner
      # v2.334.0, still undocumented when rhysd/actionlint#647 was filed).
      # Remove this once https://github.com/rhysd/actionlint/pull/696 ships.
      run: |
        actionlint \
          -ignore 'property "workflow_(repository|sha)" is not defined' \
          .github/workflows/code-review.yml .github/workflows/ci.yml
