on:
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review]
    issue_comment:
        types: [created]

jobs:
    review:
        permissions:
            contents: read
            pull-requests: write
            checks: write
            id-token: write   # required for dd-sts
        uses: DataDog/code-review-action/.github/workflows/code-review.yml@main
        with:
            provider: claude
            trigger_mode: on_demand
            review_event: COMMENT_ONLY
            prompt_file_pattern: '**/codereview_guideline.md'
            telemetry_enabled: true
            datadog_sts_policy: code-review-action-telemetry
        secrets:
            openai_api_key: ${{ secrets.OPENAI_API_KEY }}
            anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
            gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
